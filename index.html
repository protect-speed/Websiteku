<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(
180deg,
#111827,
#0f172a
);
color:white;
text-align:center;
}

header{
padding:60px 20px;
background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.profile{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin:auto;
margin-bottom:20px;
display:block;
}

h1{
font-size:36px;
margin-bottom:10px;
}

.subtitle{
opacity:.8;
}

section{
padding:50px 20px;
max-width:800px;
margin:auto;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
margin:15px auto;
width:90%;
max-width:500px;
box-shadow:0 4px 12px rgba(0,0,0,.2);
transition:.3s;
}

.card:hover{
transform:translateY(-3px);
}

.card a{
display:block;
color:white;
text-decoration:none;
font-size:20px;
font-weight:bold;
}

.card{
cursor:pointer;
}
  
  button{
background:#2563eb;
color:white;
border:none;
padding:12px 24px;
border-radius:10px;
font-size:16px;
cursor:pointer;
margin:15px 0;
}

button:hover{
opacity:.9;
}
  
a{
color:#60a5fa;
text-decoration:none;
}

footer{
padding:20px;
opacity:.7;
}

.card{
animation:fade .5s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}
  
</style>
</head>
